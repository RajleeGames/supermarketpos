{% extends 'base.html' %}

{% block title %}
    Transaction Receipt | Online Retail POS
{% endblock %}

{% block nav-item %}  
    Receipt - {{ transNo }}  
{% endblock %}

{% block content %}

<button id="qzPrintBtn" class="btn-lg btn-success" style="width: 20%; margin-top: 10px; margin-left: 10px;">
    Print Receipt
</button>

<div style="text-align: center; padding-top: 30px;">
    <pre id="receiptContent" style="font-family: 'Courier New', monospace; width: 42ch; margin: auto; text-align: left; white-space: pre-wrap;">{{ receipt }}</pre>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qz-tray/2.1.0/qz-tray.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const printBtn = document.getElementById('qzPrintBtn');
    const receiptText = document.getElementById('receiptContent').innerText || "";

    function utf8ToBase64(str) {
        return btoa(unescape(encodeURIComponent(str)));
    }

    function buildPayload(text) {
        // add space at bottom before cut
        return text.trimEnd() + "\n\n\n\n\n\n\n\n";
    }

    function connectQz() {
        if (qz.websocket.isActive()) {
            return Promise.resolve();
        }
        return qz.websocket.connect();
    }

    function autoPrint() {
        const printerName = "ZKP8008";
        const config = qz.configs.create(printerName, {
            encoding: 'UTF-8',
            margins: 0,
            copies: 1
        });

        const payload = buildPayload(receiptText);
        const base64 = utf8ToBase64(payload);

        const data = [
            // initialize
            { type: 'raw', format: 'hex', data: '1B40' },

            // print text
            { type: 'raw', format: 'base64', data: base64 },

            // feed paper more so words are not cut
            { type: 'raw', format: 'hex', data: '1B6408' },

            // cut
            { type: 'raw', format: 'hex', data: '1D5600' }
        ];

        connectQz().then(() => {
            return qz.print(config, data);
        }).then(() => {
            console.log("Printed successfully!");
        }).catch(err => {
            console.error("Printing error:", err);
            alert("Error printing: " + err);
        });
    }

    printBtn.addEventListener('click', autoPrint);
});
</script>

{% endblock content %}
