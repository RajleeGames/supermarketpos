{% extends 'base.html' %}
{% load static %}

{% block title %}
Transaction Receipt | Online Retail POS
{% endblock %}

{% block nav-item %}
<div class="mb-0 font-weight-bold h6 text-gray-600 text-uppercase p-3">
    Receipt - {{ transNo }}
</div>
{% endblock %}

{% block content %}
<style>
    .receipt-wrap {
        width: 100%;
        display: flex;
        justify-content: center;
        padding: 12px 0 30px 0;
    }

    .receipt-panel {
        width: 100%;
        max-width: 360px;
    }

    .receipt-actions {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 10px;
        flex-wrap: wrap;
    }

    .receipt-actions .btn {
        font-size: 12px;
        padding: 7px 12px;
        border-radius: 6px;
        font-weight: 700;
    }

    .receipt-card {
        width: 100%;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
        padding: 12px 10px;
        overflow-x: auto;
    }

    #receiptContent {
        margin: 0;
        width: 42ch;
        max-width: 42ch;
        font-family: "Courier New", Courier, monospace;
        font-size: 11px;
        line-height: 1.25;
        color: #111;
        text-align: left;
        white-space: pre;
    }

    .print-status {
        min-height: 18px;
        margin-top: 8px;
        text-align: center;
        font-size: 12px;
        line-height: 1.4;
        color: #6b7280;
    }

    @media print {
        .sidebar,
        .navbar,
        .topbar,
        .receipt-actions,
        .print-status,
        .scroll-to-top {
            display: none !important;
        }

        #content-wrapper,
        #content {
            width: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        .receipt-wrap {
            display: block;
            padding: 0 !important;
        }

        .receipt-panel {
            width: 80mm;
            max-width: 80mm;
            margin: 0;
        }

        .receipt-card {
            width: 80mm;
            padding: 0;
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }

        #receiptContent {
            font-size: 11px;
            line-height: 1.2;
            white-space: pre;
        }
    }
</style>

<div class="receipt-wrap">
    <div class="receipt-panel">

        <div class="receipt-actions">
            <button
                id="qzPrintBtn"
                type="button"
                class="btn btn-success"
            >
                <i class="fas fa-print"></i>
                QZ Print
            </button>

           
        </div>

        <div class="receipt-card">
            <pre id="receiptContent">{{ receipt }}</pre>
        </div>

        <div
            id="printStatus"
            class="print-status"
            role="status"
            aria-live="polite"
        ></div>

    </div>
</div>
{% endblock content %}


{% block script %}
<!-- Local QZ Tray library -->
<script src="{% static 'vendor/qz/qz-tray.js' %}"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    "use strict";

    const printBtn = document.getElementById("qzPrintBtn");
    const browserPrintBtn = document.getElementById("browserPrintBtn");
    const statusEl = document.getElementById("printStatus");
    const receiptEl = document.getElementById("receiptContent");

    const PRINTER_NAME =
        "{{ qz_printer_name|default:'ZKP8008'|escapejs }}";

    let printing = false;

    function normaliseError(error) {
        if (!error) {
            return "Unknown QZ Tray error.";
        }

        if (typeof error === "string") {
            return error;
        }

        return (
            error.message ||
            error.error ||
            String(error)
        );
    }

    function setStatus(message, isError) {
        if (!statusEl) {
            return;
        }

        statusEl.textContent = message || "";
        statusEl.style.color = isError
            ? "#b02a37"
            : "#146c43";
    }

    function setPrinting(value) {
        printing = Boolean(value);

        if (printBtn) {
            printBtn.disabled = printing;
        }
    }

    function getReceiptText() {
        if (!receiptEl) {
            return "";
        }

        return (
            receiptEl.innerText ||
            receiptEl.textContent ||
            ""
        );
    }

    function getCookie(name) {
        const cookieValue = document.cookie
            .split(";")
            .map(function (item) {
                return item.trim();
            })
            .find(function (item) {
                return item.startsWith(name + "=");
            });

        if (!cookieValue) {
            return "";
        }

        return decodeURIComponent(
            cookieValue.substring(name.length + 1)
        );
    }

    function textToBase64(text) {
        const bytes = new TextEncoder().encode(text);
        let binary = "";

        for (let index = 0; index < bytes.length; index += 1) {
            binary += String.fromCharCode(bytes[index]);
        }

        return window.btoa(binary);
    }

    function buildPayload(text) {
        return String(text || "").trimEnd() + "\n\n";
    }

    function setupQzSecurity() {
        if (!window.qz || !qz.security) {
            throw new Error(
                "QZ Tray security API is unavailable."
            );
        }

        /*
         * This must match SHA512 in transaction/views.py.
         */
        qz.security.setSignatureAlgorithm("SHA512");

        qz.security.setCertificatePromise(function (resolve, reject) {
            fetch("{% url 'qz_certificate' %}", {
                method: "GET",
                cache: "no-store",
                credentials: "same-origin",
                headers: {
                    "Accept": "text/plain"
                }
            })
            .then(function (response) {
                if (!response.ok) {
                    return response.text().then(function (message) {
                        throw new Error(
                            message ||
                            "Could not load the QZ certificate."
                        );
                    });
                }

                return response.text();
            })
            .then(function (certificate) {
                if (!certificate.trim()) {
                    throw new Error(
                        "The QZ certificate response was empty."
                    );
                }

                resolve(certificate);
            })
            .catch(reject);
        });

        qz.security.setSignaturePromise(function (toSign) {
            return function (resolve, reject) {
                fetch("{% url 'qz_sign' %}", {
                    method: "POST",
                    cache: "no-store",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "text/plain; charset=UTF-8",
                        "Accept": "text/plain",
                        "X-CSRFToken": getCookie("csrftoken"),
                        "X-Requested-With": "XMLHttpRequest"
                    },
                    body: toSign
                })
                .then(function (response) {
                    if (!response.ok) {
                        return response.text().then(function (message) {
                            throw new Error(
                                message ||
                                "The QZ signing request failed."
                            );
                        });
                    }

                    return response.text();
                })
                .then(function (signature) {
                    if (!signature.trim()) {
                        throw new Error(
                            "The QZ signature response was empty."
                        );
                    }

                    resolve(signature.trim());
                })
                .catch(reject);
            };
        });
    }

    async function connectQz() {
        if (!window.qz) {
            throw new Error(
                "QZ Tray JavaScript was not loaded. " +
                "Confirm that qz-tray.js exists at " +
                "/static/vendor/qz/qz-tray.js"
            );
        }

        setupQzSecurity();

        if (qz.websocket.isActive()) {
            return;
        }

        await qz.websocket.connect({
            retries: 3,
            delay: 1
        });
    }

    async function findPrinter() {
        try {
            return await qz.printers.find(PRINTER_NAME);
        } catch (exactPrinterError) {
            const printers = await qz.printers.find();

            const printerList = Array.isArray(printers)
                ? printers
                : [printers];

            const preferredName = String(PRINTER_NAME).toLowerCase();

            const found = printerList.find(function (printer) {
                const printerName = String(printer || "").toLowerCase();

                return (
                    printerName === preferredName ||
                    printerName.includes(preferredName) ||
                    printerName.includes("zkp") ||
                    printerName.includes("8008") ||
                    printerName.includes("thermal") ||
                    printerName.includes("pos")
                );
            });

            if (!found) {
                throw new Error(
                    "Printer was not found. " +
                    "Expected Windows printer name: " +
                    PRINTER_NAME +
                    ". Available printers: " +
                    printerList.join(", ")
                );
            }

            return found;
        }
    }

    async function printReceipt() {
        if (printing) {
            return;
        }

        const receiptText = getReceiptText();

        if (!receiptText.trim()) {
            setStatus("Receipt is empty.", true);
            return;
        }

        setPrinting(true);
        setStatus("Connecting to QZ Tray...", false);

        try {
            await connectQz();

            setStatus(
                "Finding printer " + PRINTER_NAME + "...",
                false
            );

            const printerName = await findPrinter();

            setStatus(
                "Printing to " + printerName + "...",
                false
            );

            const config = qz.configs.create(printerName, {
                encoding: "UTF-8",
                copies: 1,
                margins: 0,
                rasterize: false
            });

            const payload = buildPayload(receiptText);
            const receiptBase64 = textToBase64(payload);

            const printData = [
                /*
                 * ESC @
                 * Initialize printer.
                 */
                {
                    type: "raw",
                    format: "hex",
                    data: "1B40"
                },

                /*
                 * ESC t 16
                 * Select code page.
                 */
                {
                    type: "raw",
                    format: "hex",
                    data: "1B7410"
                },

                /*
                 * ESC ! 0
                 * Normal font.
                 */
                {
                    type: "raw",
                    format: "hex",
                    data: "1B2100"
                },

                /*
                 * Receipt text.
                 */
                {
                    type: "raw",
                    format: "base64",
                    data: receiptBase64
                },

                /*
                 * ESC d 3
                 * Feed three lines.
                 */
                {
                    type: "raw",
                    format: "hex",
                    data: "1B6403"
                },

                /*
                 * GS V 0
                 * Full paper cut.
                 */
                {
                    type: "raw",
                    format: "hex",
                    data: "1D5600"
                }
            ];

            await qz.print(config, printData);

            setStatus(
                "Receipt printed successfully.",
                false
            );

        } catch (error) {
            const message = normaliseError(error);

            console.error("QZ printing error:", error);

            setStatus(
                "Print failed: " + message,
                true
            );

            window.alert(
                "Printing error:\n\n" +
                message +
                "\n\nCheck that QZ Tray is running and " +
                "the Windows printer is named " +
                PRINTER_NAME +
                "."
            );

        } finally {
            setPrinting(false);
        }
    }

    if (printBtn) {
        printBtn.addEventListener("click", printReceipt);
    }

    if (browserPrintBtn) {
        browserPrintBtn.addEventListener("click", function () {
            window.print();
        });
    }
});
</script>
{% endblock script %}
